<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

/* ============================================================
   Jalali <-> Gregorian conversion (validated against 20,000
   random round-trips + known reference dates, 0 failures)
   ============================================================ */
function div(a, b) { return Math.floor(a / b); }
function mod(a, b) { return a - Math.floor(a / b) * b; }

const BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

function jalCal(jy) {
  const bl = BREAKS.length;
  let gy = jy + 621;
  let leapJ = -14;
  let jp = BREAKS[0];
  let jm, jump;
  let i = 1;
  for (; i < bl; i += 1) {
    jm = BREAKS[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
    jp = jm;
  }
  const n = jy - jp;
  leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
  if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  return { gy, march };
}

const MS_DAY = 86400000;

function nowruzDate(jy) {
  const r = jalCal(jy);
  return new Date(Date.UTC(r.gy, 2, r.march));
}

function yearLength(jy) {
  return Math.round((nowruzDate(jy + 1) - nowruzDate(jy)) / MS_DAY);
}

function jalaaliMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return yearLength(jy) - 336; // Esfand: 29 or 30
}

function jalaliToGregorian(jy, jm, jd) {
  const start = nowruzDate(jy);
  let dayOffset = jd - 1;
  for (let m = 1; m < jm; m++) dayOffset += jalaaliMonthLength(jy, m);
  const d = new Date(start);
  d.setUTCDate(d.getUTCDate() + dayOffset);
  return d;
}

function gregorianToJalali(date) {
  const gy = date.getUTCFullYear();
  for (const jyCandidate of [gy - 621, gy - 622, gy - 620]) {
    const start = nowruzDate(jyCandidate);
    const diffDays = Math.round((date - start) / MS_DAY);
    if (diffDays < 0) continue;
    const yLen = yearLength(jyCandidate);
    if (diffDays >= yLen) continue;
    let remaining = diffDays;
    let jm = 1;
    // eslint-disable-next-line no-constant-condition
    while (true) {
      const len = jalaaliMonthLength(jyCandidate, jm);
      if (remaining < len) break;
      remaining -= len;
      jm++;
    }
    return { jy: jyCandidate, jm, jd: remaining + 1 };
  }
  throw new Error("conversion failed");
}

function addDaysToJalali(jy, jm, jd, days) {
  const g = jalaliToGregorian(jy, jm, jd);
  g.setUTCDate(g.getUTCDate() + days);
  const j = gregorianToJalali(g);
  return { ...j, greg: g };
}

function addMonthsToJalali(jy, jm, jd, months) {
  const totalM = (jm - 1) + months;
  const newJy = jy + Math.floor(totalM / 12);
  const newJm = mod(totalM, 12) + 1;
  const newJd = Math.min(jd, jalaaliMonthLength(newJy, newJm));
  return { jy: newJy, jm: newJm, jd: newJd };
}

// Breaks a day-count (possibly negative) into a human "X months, Y days" from a start Jalali date
function monthsDaysBetween(jy, jm, jd, totalDays) {
  const startG = jalaliToGregorian(jy, jm, jd);
  const endG = new Date(startG.getTime() + totalDays * MS_DAY);
  const end = gregorianToJalali(endG);
  let months = (end.jy - jy) * 12 + (end.jm - jm);
  if (end.jd < jd) months -= 1;
  const mid = addMonthsToJalali(jy, jm, jd, months);
  const midG = jalaliToGregorian(mid.jy, mid.jm, mid.jd);
  const remainderDays = Math.round((endG - midG) / MS_DAY);
  return { months, days: remainderDays, end, endG };
}

/* ============================================================
   Persian number -> words (for cheque amount line)
   Verified against ~20 reference amounts incl. large numbers.
   ============================================================ */
const ONES = ["", "یک", "دو", "سه", "چهار", "پنج", "شش", "هفت", "هشت", "نه"];
const TEENS = ["ده", "یازده", "دوازده", "سیزده", "چهارده", "پانزده", "شانزده", "هفده", "هجده", "نوزده"];
const TENS = ["", "", "بیست", "سی", "چهل", "پنجاه", "شصت", "هفتاد", "هشتاد", "نود"];
const HUNDREDS = ["", "صد", "دویست", "سیصد", "چهارصد", "پانصد", "ششصد", "هفتصد", "هشتصد", "نهصد"];
const SCALES = ["", "هزار", "میلیون", "میلیارد", "هزار میلیارد", "میلیون میلیارد"];

function threeDigitsToWords(n) {
  const parts = [];
  const h = Math.floor(n / 100);
  const rem = n % 100;
  if (h > 0) parts.push(HUNDREDS[h]);
  if (rem > 0) {
    if (rem < 10) parts.push(ONES[rem]);
    else if (rem < 20) parts.push(TEENS[rem - 10]);
    else {
      const t = Math.floor(rem / 10);
      const o = rem % 10;
      parts.push(o === 0 ? TENS[t] : TENS[t] + " و " + ONES[o]);
    }
  }
  return parts.join(" و ");
}

function numberToPersianWords(num) {
  num = Math.floor(Math.abs(num));
  if (num === 0) return "صفر";
  const groups = [];
  let n = num;
  while (n > 0) {
    groups.push(n % 1000);
    n = Math.floor(n / 1000);
  }
  const wordGroups = [];
  for (let i = groups.length - 1; i >= 0; i--) {
    if (groups[i] === 0) continue;
    const w = threeDigitsToWords(groups[i]);
    wordGroups.push(SCALES[i] ? w + " " + SCALES[i] : w);
  }
  return wordGroups.join(" و ");
}

const FA_D = "۰۱۲۳۴۵۶۷۸۹";
const AR_D = "٠١٢٣٤٥٦٧٨٩";
function normalizeDigits(str) {
  return str
    .replace(/[۰-۹]/g, (ch) => String(FA_D.indexOf(ch)))
    .replace(/[٠-٩]/g, (ch) => String(AR_D.indexOf(ch)));
}
function parseAmount(str) {
  const n = normalizeDigits(str).replace(/[^\d]/g, "");
  return n === "" ? 0 : parseInt(n, 10);
}

/* ============================================================
   Static data
   ============================================================ */
const MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
const WEEKDAYS_FA = ["یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنجشنبه", "جمعه", "شنبه"]; // by JS getUTCDay()
const WEEK_SHORT_IRAN = ["ش", "ی", "د", "س", "چ", "پ", "ج"]; // Sat..Fri

const FA_DIGITS = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];
function toFa(n) {
  return String(n).replace(/[0-9]/g, (d) => FA_DIGITS[+d]);
}
function faCommas(n) {
  if (!n) return "";
  return toFa(n.toLocaleString("en-US"));
}

const FIXED_HOLIDAYS = {
  "1-12": "روز جمهوری اسلامی ایران",
  "1-13": "سیزده‌به‌در (روز طبیعت)",
  "3-14": "رحلت امام خمینی (ره)",
  "3-15": "قیام خونین ۱۵ خرداد",
  "11-15": "ولادت امام زمان (عج)",
  "11-22": "پیروزی انقلاب اسلامی",
};

const YEAR_HOLIDAYS = {
  1405: {
    "1-1": "جشن نوروز و عید سعید فطر",
    "1-2": "تعطیل به‌مناسبت عید سعید فطر",
    "1-3": "عید نوروز",
    "1-4": "عید نوروز",
    "1-12": "روز جمهوری اسلامی ایران",
    "1-13": "سیزده‌به‌در (روز طبیعت)",
    "1-25": "شهادت امام جعفر صادق (ع)",
    "3-6": "عید سعید قربان",
    "3-14": "عید سعید غدیر خم و رحلت امام خمینی (ره)",
    "3-15": "قیام خونین ۱۵ خرداد",
    "4-3": "تاسوعای حسینی",
    "4-4": "عاشورای حسینی",
    "5-13": "اربعین حسینی",
    "5-21": "رحلت رسول اکرم (ص) و شهادت امام حسن مجتبی (ع)",
    "5-22": "شهادت امام رضا (ع)",
    "5-30": "شهادت امام حسن عسکری (ع)",
    "6-8": "ولادت پیامبر اکرم (ص) و امام جعفر صادق (ع)",
    "10-2": "ولادت امام علی (ع) و روز پدر",
    "10-16": "مبعث حضرت رسول اکرم (ص)",
    "11-15": "ولادت امام زمان (عج)",
    "11-22": "پیروزی انقلاب اسلامی",
    "12-19": "عید سعید فطر",
    "12-20": "تعطیل به‌مناسبت عید سعید فطر",
  },
};

function checkHoliday(jy, jm, jd, weekday) {
  const key = `${jm}-${jd}`;
  const isFriday = weekday === 5;
  const yearSpecific = YEAR_HOLIDAYS[jy] && YEAR_HOLIDAYS[jy][key];
  const fixed = FIXED_HOLIDAYS[key];
  const reason = yearSpecific || fixed || null;
  const hasYearData = !!YEAR_HOLIDAYS[jy];
  return { isHoliday: isFriday || !!reason, isFriday, reason, hasYearData };
}

/* ============================================================
   Storage adapter — uses Claude's window.storage when running
   inside an Artifact, otherwise falls back to plain localStorage
   for the publicly deployed site. Always safe (try/catch'd).
   ============================================================ */
async function storageGet(key) {
  try {
    if (typeof window !== "undefined" && window.storage && window.storage.get) {
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }
  } catch (e) {
    /* key missing or artifact storage unavailable */
  }
  try {
    return typeof localStorage !== "undefined" ? localStorage.getItem(key) : null;
  } catch (e) {
    return null;
  }
}
async function storageSet(key, value) {
  try {
    if (typeof window !== "undefined" && window.storage && window.storage.set) {
      await window.storage.set(key, value, false);
      return;
    }
  } catch (e) {
    /* fall through to localStorage */
  }
  try {
    if (typeof localStorage !== "undefined") localStorage.setItem(key, value);
  } catch (e) {
    /* storage unavailable, ignore */
  }
}
async function storageDelete(key) {
  try {
    if (typeof window !== "undefined" && window.storage && window.storage.delete) {
      await window.storage.delete(key, false);
      return;
    }
  } catch (e) {}
  try {
    if (typeof localStorage !== "undefined") localStorage.removeItem(key);
  } catch (e) {}
}

function findNextBusinessDay(jy, jm, jd) {
  let g = jalaliToGregorian(jy, jm, jd);
  for (let i = 0; i < 30; i++) {
    g = new Date(g.getTime() + MS_DAY);
    const j = gregorianToJalali(g);
    const h = checkHoliday(j.jy, j.jm, j.jd, g.getUTCDay());
    if (!h.isHoliday) return { ...j, greg: g };
  }
  return null;
}

/* ============================================================
   Component
   ============================================================ */
function ChekYar() {
  const todayG = new Date();
  const todayUTC = new Date(Date.UTC(todayG.getFullYear(), todayG.getMonth(), todayG.getDate()));
  const todayJ = gregorianToJalali(todayUTC);

  const [jy, setJy] = useState(todayJ.jy);
  const [jm, setJm] = useState(todayJ.jm);
  const [jd, setJd] = useState(todayJ.jd);
  const [days, setDays] = useState(45);
  const [customDays, setCustomDays] = useState("");

  const [amount, setAmount] = useState(0);
  const [currency, setCurrency] = useState("ریال");
  const [addTamam, setAddTamam] = useState(true);
  const [copied, setCopied] = useState(false);

  const [tab, setTab] = useState("single");
  const [checks, setChecks] = useState([
    { id: 1, jy: todayJ.jy, jm: todayJ.jm, jd: todayJ.jd, amount: 0 },
  ]);
  const [multiCurrency, setMultiCurrency] = useState("ریال");
  const nextIdRef = React.useRef(2);
  const loadedOnceRef = React.useRef(false);
  const [storageNotice, setStorageNotice] = useState("");

  useEffect(() => {
    (async () => {
      try {
        const savedChecks = await storageGet("chekyar_checks_v1");
        if (savedChecks) {
          const parsed = JSON.parse(savedChecks);
          if (Array.isArray(parsed) && parsed.length > 0) {
            setChecks(parsed);
            nextIdRef.current = Math.max(...parsed.map((c) => c.id || 0)) + 1;
          }
        }
        const savedCurrency = await storageGet("chekyar_currency_v1");
        if (savedCurrency === "ریال" || savedCurrency === "تومان") setMultiCurrency(savedCurrency);
      } catch (e) {
        /* no saved data yet, or storage unavailable */
      } finally {
        loadedOnceRef.current = true;
      }
    })();
  }, []);

  useEffect(() => {
    if (!loadedOnceRef.current) return;
    storageSet("chekyar_checks_v1", JSON.stringify(checks));
  }, [checks]);

  useEffect(() => {
    if (!loadedOnceRef.current) return;
    storageSet("chekyar_currency_v1", multiCurrency);
  }, [multiCurrency]);

  const clearLedger = () => {
    const empty = [{ id: nextIdRef.current++, jy: todayJ.jy, jm: todayJ.jm, jd: todayJ.jd, amount: 0 }];
    setChecks(empty);
    storageDelete("chekyar_checks_v1");
    setStorageNotice("دفتر پاک شد ✓");
    setTimeout(() => setStorageNotice(""), 1600);
  };

  const addCheckRow = () => {
    setChecks((cs) => [
      ...cs,
      { id: nextIdRef.current++, jy: todayJ.jy, jm: todayJ.jm, jd: todayJ.jd, amount: 0 },
    ]);
  };
  const removeCheckRow = (id) => setChecks((cs) => (cs.length > 1 ? cs.filter((c) => c.id !== id) : cs));
  const updateCheckRow = (id, patch) =>
    setChecks((cs) => cs.map((c) => (c.id === id ? { ...c, ...patch } : c)));

  const multiSummary = useMemo(() => {
    const valid = checks.filter((c) => c.amount > 0);
    if (valid.length === 0) return null;
    const totalAmount = valid.reduce((s, c) => s + c.amount, 0);
    let weightedDaysSum = 0;
    const rows = valid.map((c) => {
      const g = jalaliToGregorian(c.jy, c.jm, c.jd);
      const diffDays = Math.round((g - todayUTC) / MS_DAY);
      weightedDaysSum += c.amount * diffDays;
      const h = checkHoliday(c.jy, c.jm, c.jd, g.getUTCDay());
      return { ...c, greg: g, diffDays, weekday: g.getUTCDay(), holidayInfo: h };
    });
    const avgDays = Math.round(weightedDaysSum / totalAmount);
    const avgG = new Date(todayUTC.getTime() + avgDays * MS_DAY);
    const avgJ = gregorianToJalali(avgG);
    const md = monthsDaysBetween(todayJ.jy, todayJ.jm, todayJ.jd, avgDays);
    const sorted = [...rows].sort((a, b) => a.diffDays - b.diffDays);
    return {
      rows,
      totalAmount,
      avgDays,
      avgJ,
      avgG,
      md,
      earliest: sorted[0],
      latest: sorted[sorted.length - 1],
    };
  }, [checks]);

  const dayCount = jalaaliMonthLength(jy, jm);
  const effectiveDays = customDays !== "" ? Number(customDays) : days;

  const result = useMemo(() => {
    if (!effectiveDays || effectiveDays < 1) return null;
    const due = addDaysToJalali(jy, jm, jd, effectiveDays);
    const weekday = due.greg.getUTCDay();
    const holidayInfo = checkHoliday(due.jy, due.jm, due.jd, weekday);
    const nextBiz = holidayInfo.isHoliday ? findNextBusinessDay(due.jy, due.jm, due.jd) : null;
    return { due, weekday, holidayInfo, nextBiz };
  }, [jy, jm, jd, effectiveDays]);

  const resetToday = () => {
    setJy(todayJ.jy);
    setJm(todayJ.jm);
    setJd(todayJ.jd);
  };

  const presets = [10, 15, 30, 45, 60, 90, 120];

  const calCells = useMemo(() => {
    if (!result) return [];
    const { jy: dJy, jm: dJm } = result.due;
    const monthLen = jalaaliMonthLength(dJy, dJm);
    const firstG = jalaliToGregorian(dJy, dJm, 1);
    const firstIranIdx = (firstG.getUTCDay() + 1) % 7;
    const cells = [];
    for (let i = 0; i < firstIranIdx; i++) cells.push(null);
    for (let d = 1; d <= monthLen; d++) {
      const g = jalaliToGregorian(dJy, dJm, d);
      const h = checkHoliday(dJy, dJm, d, g.getUTCDay());
      cells.push({ d, isHoliday: h.isHoliday, reason: h.reason, isFriday: h.isFriday });
    }
    return cells;
  }, [result]);

  const amountWords = amount > 0 ? numberToPersianWords(amount) : "";
  const fullPhrase = amount > 0 ? `${amountWords} ${currency}${addTamam ? " تمام" : ""}` : "";
  const otherCurrency = currency === "ریال" ? "تومان" : "ریال";

  const copyPhrase = () => {

  /* ---- Share helpers (text via Web Share API, image via html2canvas) ---- */
  const singleResultRef = React.useRef(null);

  const [shareMsg, setShareMsg] = useState({ single: "", multi: "" });

  const buildSingleShareText = () => {

    if (result.holidayInfo.isHoliday && result.nextBiz) {
      lines.push(`اولین روز کاری بعد: ${toFa(result.nextBiz.jd)} ${MONTHS[result.nextBiz.jm - 1]} ${toFa(result.nextBiz.jy)}`);

    if (fullPhrase) {
      lines.push("", `مبلغ: ${faCommas(amount)} ${currency}`, `به‌حروف: ${fullPhrase}`);
    }
    return lines.join("\n");
  };

  const buildMultiShareText = () => {
    if (!multiSummary) return "";
    const lines = [
      "📋 دفتر چک‌های مشتری — چک‌یار",
      "",

      `(حدود ${multiSummary.md.months > 0 ? toFa(multiSummary.md.months) + " ماه " : ""}${multiSummary.md.days > 0 ? "و " + toFa(multiSummary.md.days) + " روز " : ""}دیگر)`,

        );

  const shareText = async (text, key) => {
    if (!text) return;
    try {
      if (navigator.share) {
        await navigator.share({ title: "چک‌یار", text });
        return;
      }
      throw new Error("no share api");
    } catch (e) {
      try {
        await navigator.clipboard.writeText(text);
        setShareMsg((m) => ({ ...m, [key]: "کپی شد ✓" }));
        setTimeout(() => setShareMsg((m) => ({ ...m, [key]: "" })), 1600);
      } catch (e2) {
        /* ignore */
      }
    }
  };

  const loadHtml2Canvas = () =>
    new Promise((resolve, reject) => {
      if (window.html2canvas) return resolve(window.html2canvas);
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
      s.onload = () => resolve(window.html2canvas);
      s.onerror = reject;
      document.head.appendChild(s);
    });

  const shareImage = async (ref, filename, key) => {
    if (!ref.current) return;
    try {
      setShareMsg((m) => ({ ...m, [key]: "در حال ساخت عکس…" }));
      const html2canvas = await loadHtml2Canvas();
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const canvas = await html2canvas(ref.current, {
        backgroundColor: "#F3EEDC",
        scale: 2,
        useCORS: true,
      });
      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], filename, { type: "image/png" });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: "چک‌یار" });
            setShareMsg((m) => ({ ...m, [key]: "" }));
            return;
          }
          throw new Error("no file share");
        } catch (e) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          setShareMsg((m) => ({ ...m, [key]: "ذخیره شد ✓" }));
          setTimeout(() => setShareMsg((m) => ({ ...m, [key]: "" })), 1600);
        }
      }, "image/png");
    } catch (e) {
      setShareMsg((m) => ({ ...m, [key]: "خطا در ساخت عکس" }));

  /* ---- Calendar export (.ics — works with Google/Samsung/Apple Calendar) ---- */
  const icsEscape = (str) =>
    String(str).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");

  const icsDate = (d) => {
    const y = d.getUTCFullYear();
    const m = String(d.getUTCMonth() + 1).padStart(2, "0");
    const day = String(d.getUTCDate()).padStart(2, "0");
    return `${y}${m}${day}`;
  };
  const icsDateTime = (d) => {
    const y = d.getUTCFullYear();
    const mo = String(d.getUTCMonth() + 1).padStart(2, "0");
    const da = String(d.getUTCDate()).padStart(2, "0");
    const h = String(d.getUTCHours()).padStart(2, "0");
    const mi = String(d.getUTCMinutes()).padStart(2, "0");
    const s = String(d.getUTCSeconds()).padStart(2, "0");
    return `${y}${mo}${da}T${h}${mi}${s}Z`;
  };

  const buildICS = (events) => {
    const dtstamp = icsDateTime(new Date());
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Chekyar//FA", "CALSCALE:GREGORIAN"];
    events.forEach((ev, i) => {
      const start = ev.date;
      const end = new Date(start.getTime() + MS_DAY);
      lines.push("BEGIN:VEVENT");
      lines.push(`UID:chekyar-${Date.now()}-${i}@chekyar`);
      lines.push(`DTSTAMP:${dtstamp}`);
      lines.push(`DTSTART;VALUE=DATE:${icsDate(start)}`);
      lines.push(`DTEND;VALUE=DATE:${icsDate(end)}`);
      lines.push(`SUMMARY:${icsEscape(ev.summary)}`);
      if (ev.description) lines.push(`DESCRIPTION:${icsEscape(ev.description)}`);
      lines.push("BEGIN:VALARM");
      lines.push("ACTION:DISPLAY");
      lines.push(`DESCRIPTION:${icsEscape("یادآوری سررسید چک")}`);
      lines.push("TRIGGER:-P1D");
      lines.push("END:VALARM");
      lines.push("END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    return lines.join("\r\n") + "\r\n";
  };

  const downloadICS = (ics, filename) => {
    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });

    a.href = url;
    a.download = filename;
    document.body.appendChild(a);

    URL.revokeObjectURL(url);
  };

      <div className="cy-shell">

                inputMode="numeric"

                <input id="tamam" type="checkbox" checked={addTamam} onChange={(e) => setAddTamam(e.target.checked)} />

              </div>

              {fullPhrase && (
                <>
                  <div className="cy-words-box">{fullPhrase}</div>

              </div>

              <div style={{ marginTop: 14 }}>

                  const len = jalaaliMonthLength(c.jy, c.jm);

                  const g = jalaliToGregorian(c.jy, c.jm, clampedJd);
                  const h = checkHoliday(c.jy, c.jm, c.jd, g.getUTCDay());
                  const diffDays = Math.round((g - todayUTC) / MS_DAY);
                  const rowWords = c.amount > 0 ? `${numberToPersianWords(c.amount)} ${multiCurrency}` : "";
                  return (
                    <div className="cy-check-row" key={c.id}>
                      <div className="cy-check-row-header">
                        <span>چک {toFa(idx + 1)}</span>
                        {h.isHoliday && <span className="cy-mini-badge holiday">{h.reason ? h.reason : "جمعه"}</span>}

                            >

                          value={diffDays}
                          onChange={(e) => {
                            const val = e.target.value;
                            if (val === "" || val === "-") return;
                            const days = Number(val);
                            if (Number.isNaN(days)) return;
                            const d = addDaysToJalali(todayJ.jy, todayJ.jm, todayJ.jd, days);
                            updateCheckRow(c.id, { jy: d.jy, jm: d.jm, jd: d.jd });
                          }}
                        />
                        <span className="cy-days-hint">روز</span>
                      </div>

                            <option key={d} value={d}>{toFa(d)}</option>

                            const newLen = jalaaliMonthLength(c.jy, newJm);

                        <b style={{ fontWeight: 700, fontSize: 12.5 }}>

                        </b>
                      </div>
                    </div>

                    <div className="cy-result-label" style={{ marginTop: 16 }}>تاریخ سررسید متوسط (میانگین موزون بر اساس مبلغ)</div>
                    <div className="cy-result-date">
                      {toFa(multiSummary.avgJ.jd)} {MONTHS[multiSummary.avgJ.jm - 1]} {toFa(multiSummary.avgJ.jy)}

                    <div className="cy-result-weekday">{WEEKDAYS_FA[multiSummary.avgG.getUTCDay()]}</div>
                    <div className="cy-nextbiz" style={{ textAlign: "center" }}>

                        {multiSummary.md.months > 0 && `${toFa(multiSummary.md.months)} ماه `}

                        <div className="cy-list-row" key={r.id}>
                          <span>{toFa(r.jd)} {MONTHS[r.jm - 1]} {toFa(r.jy)}</span>

                            <span className="cy-mini-badge holiday">تعطیل</span>

                            <span className="cy-mini-badge">کاری</span>

                    <button className="cy-share-btn" onClick={() => shareText(buildMultiShareText(), "multi")}>📤 ارسال متن</button>

                    <button className="cy-share-btn cy-cal-btn" onClick={addAllToCalendar}>🔔 همه به تقویم</button>
                  </div>
                  {shareMsg.multi && <div className="cy-share-status">{shareMsg.multi}</div>}
                </>
              )}

              )}

              <div className="cy-sig">✒️</div>
            </div>
          </div>
        </div>

        <div className="cy-note">
          داده‌های تعطیلات رسمی ۱۴۰۵ بر اساس تقویم رسمی کشور تنظیم شده. این صفحه فقط یک ابزار محاسبه‌گر است و جایگزین برگه چک واقعی بانکی نیست.
        </div>
      </div>
    </div>
  );
}
